<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Bot Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 900px; width: 100%; background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; margin-bottom: 8px; font-size: 1.8rem; }
    p { color: #94a3b8; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #cbd5e1; }
    select, input, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #f8fafc; font-size: 1rem; }
    button { background: #0284c7; color: white; border: none; padding: 12px 20px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .output-box { margin-top: 24px; background: #090d16; border-radius: 6px; border: 1px solid #334155; overflow: hidden; display: none; }
    .output-header { background: #1e293b; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    pre { padding: 16px; overflow-x: auto; color: #38bdf8; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; }
  </style>
</head>
<body>

<div class="container">
  <h1>Telegram Bot Code Generator</h1>
  <p>Configure your preferences and generate complete, deployable bot code.</p>

  <div class="form-group">
    <label for="language">Language / Framework</label>
    <select id="language">
      <option value="python">Python (python-telegram-bot)</option>
      <option value="nodejs">Node.js (Telegraf)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="token">Bot Token (Optional for now)</label>
    <input type="text" id="token" placeholder="123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ">
  </div>

  <div class="form-group">
    <label for="commands">Custom Commands (comma separated)</label>
    <input type="text" id="commands" placeholder="help, info, ping">
  </div>

  <button onclick="generateBotCode()">Generate Bot Code</button>

  <div class="output-box" id="outputBox">
    <div class="output-header">
      <span id="fileLabel" style="font-weight: bold; color: #cbd5e1;">bot.py</span>
      <button onclick="copyCode()" style="padding: 6px 12px; font-size: 0.85rem;">Copy Code</button>
    </div>
    <pre><code id="codeBlock"></code></pre>
  </div>
</div>

<script>
function generateBotCode() {
  const lang = document.getElementById('language').value;
  const token = document.getElementById('token').value.trim() || 'YOUR_TELEGRAM_BOT_TOKEN_HERE';
  const rawCmds = document.getElementById('commands').value.split(',').map(c => c.trim()).filter(c => c);
  
  let code = '';
  
  if (lang === 'python') {
    document.getElementById('fileLabel').innerText = 'bot.py';
    let cmdHandlers = rawCmds.map(cmd => 
      `async def ${cmd}_command(update: Update, context: ContextTypes.DEFAULT_TYPE):\n    await update.message.reply_text("Executing /${cmd} command!")`
    ).join('\n\n');

    let registerHandlers = rawCmds.map(cmd => 
      `    app.add_handler(CommandHandler("${cmd}", ${cmd}_command))`
    ).join('\n');

    code = `import logging
from telegram import Update
from telegram.ext import ApplicationBuilder, CommandHandler, ContextTypes

TOKEN = "${token}"

logging.basicConfig(format='%(asctime)s - %(name)s - %(levelname)s - %(message)s', level=logging.INFO)

async def start(update: Update, context: ContextTypes.DEFAULT_TYPE):
    await update.message.reply_text("Hello! Your bot is active and running.")

${cmdHandlers}

if __name__ == '__main__':
    app = ApplicationBuilder().token(TOKEN).build()
    
    app.add_handler(CommandHandler("start", start))
${registerHandlers}
    
    print("Bot starting...")
    app.run_polling()`;
  } else {
    document.getElementById('fileLabel').innerText = 'bot.js';
    let cmdHandlers = rawCmds.map(cmd => 
      `bot.command('${cmd}', (ctx) => ctx.reply('Executing /${cmd} command!'));`
    ).join('\n');

    code = `const { Telegraf } = require('telegraf');

const bot = new Telegraf(process.env.BOT_TOKEN || '${token}');

bot.start((ctx) => ctx.reply('Hello! Your bot is active and running.'));
${cmdHandlers}

bot.launch().then(() => console.log('Bot started successfully!'));

process.once('SIGINT', () => bot.stop('SIGINT'));
process.once('SIGTERM', () => bot.stop('SIGTERM'));`;
  }

  document.getElementById('codeBlock').innerText = code;
  document.getElementById('outputBox').style.display = 'block';
}

function copyCode() {
  const code = document.getElementById('codeBlock').innerText;
  navigator.clipboard.writeText(code);
  alert('Code copied to clipboard!');
}
</script>

</body>
</html>
